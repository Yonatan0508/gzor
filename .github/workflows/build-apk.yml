name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (preinstalled on the runner)
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && ls $ANDROID_HOME

      - name: Install
        run: npm ci

      - name: Download the AI model
        run: npm run model

      - name: Build web app and sync to Android
        run: npm run sync

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gzor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gzor-apk
          path: gzor.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: גזור והזז 1.0.${{ github.run_number }}
          body: "להתקנה: פתחו את הקישור בטלפון, הורידו את gzor.apk ופתחו אותו."
          files: gzor.apk
          make_latest: true
